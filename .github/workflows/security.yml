name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 20 * * 0"   # weekly

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-banner --redact --verbose

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v7
      - run: semgrep scan --config p/default --config p/javascript --config p/owasp-top-ten --error

  standards:
    name: Rascend standards check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch playbook scripts
        run: |
          git clone --depth 1 https://github.com/rascendtechnologies/rascend-playbook.git /tmp/playbook
      - run: /tmp/playbook/scripts/check-project.sh .

  # Enable once the project has a preview URL secret (PREVIEW_URL):
  # headers:
  #   name: Security headers
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - run: scripts/check-headers.sh "${{ secrets.PREVIEW_URL }}"
